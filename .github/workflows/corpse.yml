name: Build Corpse Decay

on:
  push:
    branches: [corpse-decay]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corpse-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Self-test on a dedicated server
        id: selftest
        if: steps.build.outcome == 'success' && hashFiles('src/main/java/com/harold/corpsedecay/test/SelfTest.java') != ''
        continue-on-error: true
        run: |
          mkdir -p run-selftest && echo "eula=true" > run-selftest/eula.txt
          printf 'online-mode=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\nspawn-monsters=false\ngenerate-structures=false\n' > run-selftest/server.properties
          echo 'generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":3},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}' >> run-selftest/server.properties
          timeout 900 ./gradlew runServer -Pselftest -Prundir=run-selftest 2>&1 | tee selftest.log || true
          grep -q "SELFTEST PASS" selftest.log

      - name: World generation test (real shipwrecks)
        id: gentest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p run-gentest && echo "eula=true" > run-gentest/eula.txt
          printf 'online-mode=false\nspawn-protection=0\nspawn-monsters=false\nlevel-seed=2468\ngenerate-structures=true\n' > run-gentest/server.properties
          # a datapack that hands vanilla wrecks to the late crew placer too, as a compat add-on would its own
          mkdir -p run-gentest/world/datapacks/latetest/data/corpsedecay/tags/worldgen/structure
          echo '{"pack":{"pack_format":15,"description":"late crews test"}}' > run-gentest/world/datapacks/latetest/pack.mcmeta
          echo '{"replace":false,"values":["minecraft:shipwreck","minecraft:shipwreck_beached"]}' > run-gentest/world/datapacks/latetest/data/corpsedecay/tags/worldgen/structure/late_crews.json
          timeout 900 ./gradlew runServer -Pgentest -Prundir=run-gentest 2>&1 | tee gentest.log || true
          grep -q "GENTEST PASS" gentest.log

      - name: Client screenshots on a virtual screen
        id: clienttest
        if: steps.selftest.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 > /dev/null
          mkdir -p run-client/saves && cp -r run-selftest/world run-client/saves/test
          printf 'onboardAccessibility:false\nskipMultiplayerWarning:true\njoinedFirstServer:true\ntutorialStep:none\nrenderDistance:5\nsimulationDistance:5\npauseOnLostFocus:false\nfullscreen:false\nsoundCategory_master:0.0\nguiScale:2\nfov:0.0\n' > run-client/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.5 MESA_GLSL_VERSION_OVERRIDE=450
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew runClient -Pclienttest -Prundir=run-client 2>&1 | tee clienttest.log || true
          grep -q "CLIENTTEST DONE" clienttest.log

      - name: Compat world on a real Forge server (Better Shipwrecks)
        id: compat
        if: steps.build.outcome == 'success' && hashFiles('libs/bettershipwrecks-1.3.1forge-1.20.1.jar') != ''
        continue-on-error: true
        run: |
          set -x
          mkdir -p run-compat && cd run-compat
          curl -sSL -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-installer.jar
          java -jar installer.jar --installServer . > install.log 2>&1 || (tail -30 install.log; exit 1)
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-seed=2468\nspawn-monsters=false\nview-distance=6\n' > server.properties
          mkdir -p mods
          cp $(ls ../build/libs/corpsedecay-*.jar | grep -v sources | head -1) mods/
          cp ../libs/*.jar mods/
          (cd ../compat/bettershipwrecks && zip -qr ../../run-compat/mods/corpsedecay_bettershipwrecks-1.0.0.jar META-INF pack.mcmeta data)
          ls -la mods
          echo '-Xmx3G -Dcorpsedecay.gentest=true -Dcorpsedecay.compattest=true' > user_jvm_args.txt
          timeout 1500 bash run.sh nogui > ../compattest.log 2>&1 || true
          cd ..
          grep -E "GENTEST|COMPAT|crew aboard|Exception|ERROR" compattest.log | head -60 || true
          cat run-compat/wrecks.txt || true
          grep -q "COMPAT PASS" compattest.log

      - name: Compat screenshots
        id: compatshots
        if: steps.compat.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 > /dev/null
          pip install -q nbtlib
          mkdir -p run-client2/saves && cp -r run-compat/world run-client2/saves/test
          rm -rf run-client2/saves/test/datapacks
          python3 - <<'PY'
          import nbtlib
          f = nbtlib.load('run-client2/saves/test/level.dat')
          d = f['Data']
          dp = d.get('DataPacks')
          if dp is not None:
              keep = [x for x in dp['Enabled'] if 'shipwreck' not in str(x) and 'toni' not in str(x)]
              dp['Enabled'] = nbtlib.List[nbtlib.String](keep)
          for k in ('fml', 'forge'):
              if k in f:
                  del f[k]
          f.save()
          print('level.dat cleaned', list(f.keys()))
          PY
          printf 'onboardAccessibility:false\nskipMultiplayerWarning:true\njoinedFirstServer:true\ntutorialStep:none\nrenderDistance:6\nsimulationDistance:5\npauseOnLostFocus:false\nfullscreen:false\nsoundCategory_master:0.0\nguiScale:2\nfov:0.0\n' > run-client2/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.5 MESA_GLSL_VERSION_OVERRIDE=450
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew runClient -Pclienttest -Pshots=$PWD/run-compat/wrecks.txt -Prundir=run-client2 2>&1 | tee compatclient.log || true
          grep -q "CLIENTTEST DONE" compatclient.log

      - name: Publish result
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ || true
          cp selftest.log /tmp/out/ 2>/dev/null || true
          cp gentest.log /tmp/out/ 2>/dev/null || true
          cp run-selftest/logs/latest.log /tmp/out/server-latest.log 2>/dev/null || true
          cp clienttest.log /tmp/out/ 2>/dev/null || true
          cp compattest.log compatclient.log run-compat/wrecks.txt /tmp/out/ 2>/dev/null || true
          cp run-compat/logs/latest.log /tmp/out/compat-server-latest.log 2>/dev/null || true
          cp run-client2/screenshots/*.png /tmp/out/ 2>/dev/null || true
          cp run-client/logs/latest.log /tmp/out/client-latest.log 2>/dev/null || true
          cp run-client/screenshots/*.png /tmp/out/ 2>/dev/null || true
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          echo "build=${{ steps.build.outcome }} selftest=${{ steps.selftest.outcome }} clienttest=${{ steps.clienttest.outcome }} gentest=${{ steps.gentest.outcome }} compat=${{ steps.compat.outcome }} compatshots=${{ steps.compatshots.outcome }} $GITHUB_SHA" > /tmp/out/STATUS
          if ! git ls-remote --exit-code origin refs/heads/corpse-mc-classpath >/dev/null; then
            ./gradlew dumpClasspath -q || true
            mkdir -p /tmp/cprepo && ls -la build/cp | tee /tmp/out/CLASSPATH
            find ~/.gradle/caches -name "*mapped_official*" | tee -a /tmp/out/CLASSPATH
            SRC=$(find ~/.gradle/caches -name "*mapped_official*sources*.jar" | head -1)
            if [ -n "$SRC" ]; then cp "$SRC" build/cp/zz-mc-sources.jar; fi
            tar -cf /tmp/cprepo/cp.tar -C build/cp .
            (cd /tmp/cprepo && split -b 45m cp.tar cp.tar.part- && rm cp.tar && git init -q && git -c user.name=ci -c user.email=ci@example.com add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm classpath && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/corpse-mc-classpath)
          fi
          cd /tmp/out && git init -q && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-corpse
