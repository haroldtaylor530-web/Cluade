name: Build HBM Nuclear Shells

on:
  push:
    branches: [hbm-nuke-shells]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hbm-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # The exact jars from the player's instance, found on Modrinth by their SHA-1 (nothing is re-hosted here).
      - name: Fetch the mods by hash
        run: |
          mkdir -p dl
          while read sha name; do
            [ -z "$sha" ] && continue
            url=$(curl -s "https://api.modrinth.com/v2/version_file/$sha?algorithm=sha1" | jq -r '.files[] | select(.hashes.sha1=="'$sha'") | .url' 2>/dev/null | head -1)
            if [ -n "$url" ] && [ "$url" != "null" ]; then
              curl -sSL -o "dl/$name" "$url" && echo "got $name"
            else
              echo "NOT ON MODRINTH: $name"
            fi
          done < mods.sha1
          # same mod, Modrinth's build, when the exact file isn't there
          pick() { # project version-substring name
            [ -f "dl/$3" ] && return
            url=$(curl -s "https://api.modrinth.com/v2/project/$1/version?game_versions=%5B%221.20.1%22%5D&loaders=%5B%22forge%22%5D" \
              | jq -r '[.[] | select(.version_number | contains("'$2'"))][0].files[0].url // empty')
            [ -z "$url" ] && url=$(curl -s "https://api.modrinth.com/v2/project/$1/version?game_versions=%5B%221.20.1%22%5D&loaders=%5B%22forge%22%5D" | jq -r '.[0].files[0].url // empty')
            if [ -n "$url" ]; then curl -sSL -o "dl/$3" "$url" && echo "got $3 from $url"; else echo "NOT FOUND: $3"; fi
          }
          pick Gwl4VXlb 1.1.3 cbc_enhanced_shells.jar
          pick geckolib 4.8.4 geckolib.jar
          ls -la dl
          [ -f dl/hbm.jar ] && cp dl/hbm.jar libs/hbm.jar || true
          [ -f dl/golemcore.jar ] && cp dl/golemcore.jar libs/golemcore.jar || true
          ls -la libs

      - name: Build
        id: build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Test on a real Forge server
        id: test
        continue-on-error: true
        run: |
          mkdir -p run-test && cd run-test
          # newer Forge: CBC: Warium Projectiles uses the mod-constructor arguments added in 47.4
          for v in 47.4.10 47.4.9 47.4.8 47.4.6 47.4.4 47.4.0; do
            curl -fsSL -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-$v/forge-1.20.1-$v-installer.jar && { echo "Forge $v"; break; }
          done
          java -jar installer.jar --installServer . > install.log 2>&1 || (tail -30 install.log; exit 1)
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=flat\ngenerate-structures=false\nspawn-monsters=false\nview-distance=4\n' > server.properties
          mkdir -p mods
          cp $(ls ../build/libs/hbmnukeshells-*.jar | grep -v sources | head -1) mods/
          for f in ../dl/*.jar; do cp "$f" mods/; done
          [ -f mods/hbm.jar ] || cp ../libs/hbm.jar mods/
          [ -f mods/golemcore.jar ] || cp ../libs/golemcore.jar mods/
          rm -f mods/gemrender.jar
          ls -la mods
          echo '-Xmx4G -Dhbmnukeshells.selftest=true' > user_jvm_args.txt
          timeout 1500 bash run.sh nogui > ../test.log 2>&1 || true
          cd ..
          grep -E "HBMTEST|went off as|Mixin|mixin.*hbmnukeshells|Exception|ERROR" test.log | head -120 || true
          grep -q "HBMTEST PASS" test.log

      - name: Publish result
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log test.log /tmp/out/ 2>/dev/null || true
          cp run-test/logs/latest.log /tmp/out/server-latest.log 2>/dev/null || true
          cp run-test/logs/debug.log /tmp/out/server-debug.log 2>/dev/null || true
          ls dl > /tmp/out/DOWNLOADED 2>/dev/null || true
          cp $(ls build/libs/hbmnukeshells-*.jar | grep -v sources) /tmp/out/ 2>/dev/null || true
          echo "build=${{ steps.build.outcome }} test=${{ steps.test.outcome }} $GITHUB_SHA" > /tmp/out/STATUS
          cd /tmp/out && git init -q && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-hbm-nuke-shells
