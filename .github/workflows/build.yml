name: Build mod

on:
  push:
    branches: [realistic-survival]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --no-configuration-cache --stacktrace 2>&1 | tee build.log

      - name: Self-test on a real server
        id: selftest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p run-selftest && echo "eula=true" > run-selftest/eula.txt
          printf 'online-mode=false\nspawn-protection=0\n' > run-selftest/server.properties
          timeout 900 ./gradlew runSelftest --no-configuration-cache 2>&1 | tee selftest.log || true
          grep -q "SELFTEST PASS" selftest.log

      # Publish the result (log, jar, and once, the game's source for reference)
      # to the ci-output branch so it can be read without a GitHub login.
      - name: Publish result
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ || true
          cp selftest.log /tmp/out/ 2>/dev/null || true
          cp run-selftest/logs/latest.log /tmp/out/server-latest.log 2>/dev/null || true
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          echo "build=${{ steps.build.outcome }} selftest=${{ steps.selftest.outcome }} $GITHUB_SHA" > /tmp/out/STATUS
          if ! git ls-remote --exit-code origin refs/heads/mc-sources >/dev/null; then
            ls -la build/moddev/artifacts/ | tee /tmp/out/SOURCES || true
            JAR=$(ls -S build/moddev/artifacts/*.jar 2>/dev/null | grep -v sources | head -1)
            echo "game jar: $JAR" | tee -a /tmp/out/SOURCES
            if [ -n "$JAR" ]; then
              curl -sSL -o /tmp/vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
              mkdir -p /tmp/dec /tmp/srcrepo
              java -jar /tmp/vf.jar -only=net/minecraft -only=net/neoforged -only=com/mojang "$JAR" /tmp/dec > /tmp/vf.log 2>&1 || tail -20 /tmp/vf.log
              (cd /tmp/dec && find . -type f | head -3; tar -cJf /tmp/srcrepo/mcsrc.tar.xz .)
              cp "$JAR" /tmp/srcrepo/game.jar
              cd /tmp/srcrepo && git init -q
              git -c user.name=ci -c user.email=ci@example.com add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "minecraft sources"
              git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/mc-sources
              cd "$GITHUB_WORKSPACE"
            fi
          fi
          if ! git ls-remote --exit-code origin refs/heads/mc-classpath >/dev/null; then
            ./gradlew dumpClasspath --no-configuration-cache -q || true
            mkdir -p /tmp/cprepo && ls build/cp | tee /tmp/out/CLASSPATH
            tar -cf /tmp/cprepo/cp.tar -C build/cp .
            (cd /tmp/cprepo && split -b 45m cp.tar cp.tar.part- && rm cp.tar && git init -q && git -c user.name=ci -c user.email=ci@example.com add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm classpath && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/mc-classpath)
          fi
          cd /tmp/out && git init -q && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-output
